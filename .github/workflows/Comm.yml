name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: Comm.sln
      Project_Path: Comm.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '1.0.x'

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false
      env:
        Configuration: ${{ matrix.configuration }}

    # 验证构建输出
    - name: Verify build output
      run: |
        Write-Host "Checking build output directory..."
        Get-ChildItem -Path "${{ github.workspace }}\bin\Release\" -Recurse -File
        Write-Host ""

        $exeFiles = Get-ChildItem -Path "${{ github.workspace }}\bin\Release\" -Filter "*.exe" -Recurse
        if ($exeFiles.Count -gt 0) {
          Write-Host "✅ Found $($exeFiles.Count) EXE file(s):"
          $exeFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
        } else {
          Write-Host "❌ No EXE files found in bin\Release\"
          Write-Host "Directory contents:"
          Get-ChildItem -Path "${{ github.workspace }}\bin\Release\" -Recurse
          exit 1
        }
      shell: pwsh

    # 上传构建产物
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 串口调试工具
        path: |
          ${{ github.workspace }}\bin\Release\*.exe
          ${{ github.workspace }}\bin\Release\*.pdb
        if-no-files-found: error  # 如果没有找到文件则报错

    # 可选：也上传整个 Release 文件夹（包含所有依赖）
    - name: Upload full release folder
      uses: actions/upload-artifact@v4
      with:
        name: 串口调试工具-完整
        path: ${{ github.workspace }}\bin\Release\
        if-no-files-found: warn

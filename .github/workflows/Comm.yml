name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]       # 只构建 Release 版本

    runs-on: windows-latest

    env:
      Solution_Name: Comm.sln          # 修改为你的 sln 文件名，例如 WpfApp1.sln
      Project_Path:  Comm.csproj       # 修改为你的项目文件，例如 WpfApp1/WpfApp1.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '1.0.x'  # 根据你的项目目标框架调整，例如 '6.0.x'

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration /p:Platform="Any CPU"
      env:
        Configuration: ${{ matrix.configuration }}

    # 上传生成的 exe 文件作为构建产物（Artifact）
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 串口调试工具    # 给产物起的名字，方便查找
        path: |
          ${{ github.workspace }}/Comm/bin/Release/*.exe   # 修改为你的项目名，例如 WpfApp1/bin/Release/*.exe

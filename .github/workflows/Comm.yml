name: .NET Core Desktop

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 获取版本号（去掉 v 前缀，用于文件名和显示）
    - name: Get version
      id: get_version
      run: |
        $ref = $env:GITHUB_REF
        if ($ref -match "refs/tags/[Vv](.+)") {
          $version = $matches[1]   # 得到 "1.0.9"
        } else {
          $version = "latest"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag=v$version" >> $env:GITHUB_OUTPUT   # 额外输出带 v 的标签名
        Write-Host "📌 版本号: $version"
      shell: pwsh

    - name: Restore
      run: msbuild Comm.sln /t:Restore /p:Configuration=Release

    - name: Build
      run: msbuild Comm.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false

    # 打包 EXE
    - name: Package EXE
      run: |
        New-Item -ItemType Directory -Force -Path "publish"
        Copy-Item -Path "bin\Release\*.exe" -Destination "publish\" -Force

        $version = "${{ steps.get_version.outputs.version }}"
        if ($version -ne "latest") {
          $exeFile = Get-ChildItem -Path "publish\" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            $newName = "Comm_v$version.exe"
            Rename-Item -Path $exeFile.FullName -NewName $newName
            Write-Host "✅ 重命名为: $newName"
          }
        }
      shell: pwsh

    - name: List files
      run: |
        Write-Host "📁 publish 目录内容:"
        Get-ChildItem -Path "publish\" -Recurse
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Comm_v${{ steps.get_version.outputs.version }}
        path: publish\*.exe
        if-no-files-found: error

    # 创建 Release 并上传 EXE
    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v1
      with:
        files: publish/*.exe
        generate_release_notes: true
        name: Comm v${{ steps.get_version.outputs.version }}
        tag_name: ${{ steps.get_version.outputs.tag }}   # 使用带 v 的标签名
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '1.0.x'

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 获取版本号（如果是标签触发）
    - name: Get version
      id: get_version
      run: |
        if ($env:GITHUB_REF -match "refs/tags/v(.+)") {
          $version = $matches[1]
        } else {
          $version = "latest"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Restore
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release
      env:
        Solution_Name: Comm.sln

    # 构建并生成日志（注意用引号包裹 /flp 参数）
    - name: Build the application
      run: |
        msbuild $env:Solution_Name /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false "/flp:LogFile=build.log;Verbosity=detailed"
      env:
        Solution_Name: Comm.sln

    # ========== 产物1：仅 EXE 文件（用户下载） ==========
    - name: Package EXE only
      run: |
        New-Item -ItemType Directory -Force -Path "publish\exe"
        Copy-Item -Path "bin\Release\*.exe" -Destination "publish\exe\" -Force

        # 如果是标签版本，重命名文件
        $version = "${{ steps.get_version.outputs.version }}"
        if ($version -ne "latest") {
          $exeFiles = Get-ChildItem -Path "publish\exe\" -Filter "*.exe"
          foreach ($file in $exeFiles) {
            $newName = "Comm_v$version.exe"
            Rename-Item -Path $file.FullName -NewName $newName
          }
        } else {
          # 最新版重命名为 Comm.exe
          $exeFiles = Get-ChildItem -Path "publish\exe\" -Filter "*.exe"
          foreach ($file in $exeFiles) {
            $newName = "Comm.exe"
            Rename-Item -Path $file.FullName -NewName $newName
          }
        }
      shell: pwsh

    # ========== 产物2：构建日志（开发者调试） ==========
    - name: Package build logs
      run: |
        New-Item -ItemType Directory -Force -Path "publish\logs"

        # 复制构建日志
        if (Test-Path "build.log") {
          Copy-Item -Path "build.log" -Destination "publish\logs\" -Force
        }

        # 生成构建信息文件
        @"
        Build Information
        ==================
        Build Time: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Version: ${{ steps.get_version.outputs.version }}
        Commit SHA: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        Triggered by: ${{ github.event_name }}
        Runner: ${{ runner.os }}
        "@ | Out-File -FilePath "publish\logs\build_info.txt" -Encoding UTF8

        # 压缩完整的 Release 输出（用于排查问题）
        Compress-Archive -Path "bin\Release\*" -DestinationPath "publish\logs\release_output.zip" -Force
      shell: pwsh

    # ========== 上传产物1：用户版 EXE ==========
    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: Comm_v${{ steps.get_version.outputs.version }}
        path: publish\exe\*.exe
        if-no-files-found: error

    # ========== 上传产物2：构建日志包 ==========
    - name: Upload build logs artifact
      uses: actions/upload-artifact@v4
      with:
        name: Comm_BuildLogs_v${{ steps.get_version.outputs.version }}
        path: publish\logs\
        if-no-files-found: error

    # ========== 如果是 Release 标签，自动发布到 Releases ==========
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          publish\exe\*.exe
        generate_release_notes: true
        name: Comm v${{ steps.get_version.outputs.version }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

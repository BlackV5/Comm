name: .NET Core Desktop

on:
  push:
    tags:
      - 'v*'  # 只监听标签推送

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 获取版本号
    - name: Get version
      id: get_version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Restore
    - name: Restore
      run: msbuild Comm.sln /t:Restore /p:Configuration=Release

    # 构建
    - name: Build
      run: msbuild Comm.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false

    # 提取并重命名 EXE
    - name: Extract EXE
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path "publish"

        # 复制 EXE 文件
        Copy-Item -Path "bin\Release\*.exe" -Destination "publish\" -Force

        # 获取版本号
        $version = "${{ steps.get_version.outputs.version }}"

        # 重命名为 Comm_vX.X.X.exe
        $exeFile = Get-ChildItem -Path "publish\" -Filter "*.exe" | Select-Object -First 1
        if ($exeFile) {
          $newName = "Comm_v$version.exe"
          Rename-Item -Path $exeFile.FullName -NewName $newName
          Write-Host "✅ EXE 已提取: $newName"
        }
      shell: pwsh

    # 验证文件是否存在
    - name: Verify EXE
      run: |
        if (Test-Path "publish\*.exe") {
          Write-Host "✅ EXE 文件存在"
          Get-ChildItem "publish\*.exe"
        } else {
          Write-Host "❌ 未找到 EXE 文件"
          exit 1
        }
      shell: pwsh

    # 自动创建 Release 并上传 EXE
    - name: Create Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: publish\*.exe
        generate_release_notes: true
        name: Comm v${{ steps.get_version.outputs.version }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

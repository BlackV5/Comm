name: .NET Core Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 获取版本号
    - name: Get version
      id: get_version
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Restore
    - name: Restore
      run: msbuild Comm.sln /t:Restore /p:Configuration=Release

    # 构建
    - name: Build
      run: msbuild Comm.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false

    # 提取并重命名 EXE
    - name: Extract EXE
      run: |
        New-Item -ItemType Directory -Force -Path "publish"
        Copy-Item -Path "bin\Release\*.exe" -Destination "publish\" -Force

        $version = "${{ steps.get_version.outputs.version }}"
        $exeFile = Get-ChildItem -Path "publish\" -Filter "*.exe" | Select-Object -First 1
        if ($exeFile) {
          $newName = "Comm_v$version.exe"
          Rename-Item -Path $exeFile.FullName -NewName $newName
          Write-Host "✅ EXE 已提取: $newName"
        }
      shell: pwsh

    # 验证文件
    - name: Verify EXE
      run: |
        Get-ChildItem -Path "publish\" -Recurse
        if (Test-Path "publish\*.exe") {
          Write-Host "✅ EXE 文件存在"
        } else {
          Write-Host "❌ 未找到 EXE 文件"
          exit 1
        }
      shell: pwsh

    # 使用 GitHub CLI 上传到 Release
    - name: Upload to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 查看文件
        Get-ChildItem -Path "publish\"

        # 获取 Release ID（基于当前标签）
        $tag = "${{ github.ref_name }}"
        $releaseId = gh api repos/${{ github.repository }}/releases/tags/$tag --jq '.id'

        if ($releaseId) {
          Write-Host "找到 Release ID: $releaseId"
          # 上传 EXE 文件
          gh api -X POST repos/${{ github.repository }}/releases/$releaseId/assets `
            -f name="Comm_$tag.exe" `
            -f label="Comm $tag" `
            --input "publish\Comm_$tag.exe"
          Write-Host "✅ 上传成功!"
        } else {
          Write-Host "❌ 未找到 Release，请先创建 Release"
          exit 1
        }
      shell: pwsh

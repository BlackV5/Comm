name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 获取版本号
    - name: Get version
      id: get_version
      run: |
        if ($env:GITHUB_REF -match "refs/tags/v(.+)") {
          $version = $matches[1]
        } else {
          $version = "latest"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    # Restore
    - name: Restore
      run: msbuild Comm.sln /t:Restore /p:Configuration=Release

    # 构建
    - name: Build
      run: msbuild Comm.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /p:GenerateManifests=false /p:SignAssembly=false

    # 打包 EXE
    - name: Package EXE
      run: |
        New-Item -ItemType Directory -Force -Path "publish"
        Copy-Item -Path "bin\Release\*.exe" -Destination "publish\" -Force

        $version = "${{ steps.get_version.outputs.version }}"
        if ($version -ne "latest") {
          $exeFile = Get-ChildItem -Path "publish\" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            $newName = "Comm_v$version.exe"
            Rename-Item -Path $exeFile.FullName -NewName $newName
          }
        }
      shell: pwsh

    # 上传到 Artifacts（用于调试）
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Comm_v${{ steps.get_version.outputs.version }}
        path: publish\*.exe
        if-no-files-found: error

    # 上传到 Release（重要：这是关键步骤）
    - name: Upload to Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: publish\*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
